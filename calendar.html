<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<meta name="robots" content="noindex, nofollow">
	<title>Добавить в календарь - danilpsy.ee</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 20px; background: #f4f0eb; color: #292621; font: 15px/1.45 Arial, sans-serif; }
		main { max-width: 520px; margin: 4vh auto; padding: 28px; border-radius: 16px; background: #fffdfa; text-align: center; }
		h1 { margin: 14px 0 6px; font: 30px/1.2 Georgia, serif; }
		.calendar-emblem { display: grid; place-items: center; width: 62px; height: 62px; margin: auto; border-radius: 50%; background: #e7eae3; color: #1f4034; }
		.calendar-emblem svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; }
		.caption { margin: 0 0 22px; color: #716c65; }
		nav { display: grid; gap: 10px; }
		nav a, button { display: flex; align-items: center; gap: 18px; min-height: 72px; padding: 10px 18px; border: 1px solid #e6dfd6; border-radius: 12px; background: transparent; color: #292621; font: inherit; font-size: 18px; text-align: left; text-decoration: none; cursor: pointer; }
		nav a::after, button::after { content: '›'; margin-left: auto; font-size: 28px; }
		nav a:hover, button:hover:not(:disabled) { background: #f2ede5; }
		.provider-icon { display: grid; place-items: center; flex: 0 0 46px; height: 46px; border-radius: 50%; background: #efeee9; font-weight: 700; font-size: 24px; }
		.provider-icon svg { width: 26px; height: 30px; fill: currentColor; }
		.google { color: #4285f4; }
		.outlook { color: #0078d4; }
		#details, .calendar-note { color: #77716a; font-size: 12px; }
		html.embedded body { padding: 0; background: #fffdfa; }
		html.embedded main { margin: 0 auto; padding: 30px; }
		html.embedded .site-link, html.embedded .calendar-note { display: none; }
		@media (max-width: 400px) { main, html.embedded main { padding: 24px 16px; } h1 { font-size: 26px; } nav a, button { font-size: 16px; } }
		a { color: #315f4f; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<main>
		<a class="site-link" href="/">danilpsy.ee</a>
		<div class="calendar-emblem" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M7 3v4M17 3v4M3 10h18M7 14h2m3 0h2m3 0h1M7 18h2m3 0h2"></path></svg></div>
		<h1>Добавить в календарь</h1>
		<p class="caption">Сохраните свою консультацию в календаре,<br>чтобы не забыть о встрече.</p>
		<p id="details" role="status"></p>
		<nav id="actions" aria-label="Выбор календаря" hidden>
			<button id="download" type="button"><span class="provider-icon" aria-hidden="true"><svg viewBox="0 0 24 28"><path d="M15 5c2-1 3-3 3-5-2 0-4 2-4 4v1ZM12 7C7 3 2 7 2 13c0 6 4 13 7 13 2 0 2-1 4-1s3 1 4 1c3 0 6-5 7-8-5-2-6-7-2-10-3-4-6-3-10-1Z"></path></svg></span>Apple Calendar (.ics)</button>
			<a id="google" target="_blank" rel="noopener noreferrer"><span class="provider-icon google" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="#4285f4" d="M3 2h26v27H3z"></path><path fill="#fff" d="M8 8h16v16H8z"></path><path fill="#34a853" d="M8 24h16v6H8z"></path><path fill="#fbbc04" d="M24 8h6v16h-6z"></path><path fill="#ea4335" d="m24 24 6-6v12h-6z"></path><text x="16" y="20" text-anchor="middle" fill="#4285f4" font-size="13" font-family="Arial">31</text></svg></span>Google Calendar</a>
			<a id="outlook" target="_blank" rel="noopener noreferrer"><span class="provider-icon outlook" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="10" y="3" width="20" height="25" rx="2" fill="#0078d4"></rect><path fill="#50b4ed" d="m10 12 10 8 10-8v16H10z"></path><rect x="1" y="8" width="17" height="20" rx="2" fill="#0364b8"></rect><text x="9.5" y="23" text-anchor="middle" fill="#fff" font-size="14" font-family="Arial">O</text></svg></span>Outlook</a>
		</nav>
		<p class="calendar-note">Добавление происходит только по вашему выбору. После переноса или отмены встречи обновите запись в своем календаре вручную.</p>
	</main>
	<script src="calendar.js"></script>
</body>
</html>
