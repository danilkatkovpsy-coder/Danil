<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="referrer" content="no-referrer">
	<meta name="robots" content="noindex, nofollow">
	<title>Добавить в календарь - danilpsy.ee</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; padding: 24px; background: #f4f0eb; color: #292621; font: 16px/1.6 Arial, sans-serif; }
		main { max-width: 520px; margin: 8vh auto; padding: 28px; border-radius: 16px; background: #fffdfa; }
		h1 { font-size: 24px; }
		nav { display: grid; gap: 12px; }
		nav a, button { display: block; padding: 12px 16px; border: 1px solid #d7cec5; border-radius: 8px; background: #315f4f; color: #fff; font: inherit; text-align: center; text-decoration: none; cursor: pointer; }
		a { color: #315f4f; }
		[hidden] { display: none !important; }
	</style>
</head>
<body>
	<main>
		<a href="/">danilpsy.ee</a>
		<h1>Добавить в свой календарь</h1>
		<p id="details" role="status"></p>
		<nav id="actions" aria-label="Выбор календаря" hidden>
			<a id="google" target="_blank" rel="noopener noreferrer">Google Calendar</a>
			<a id="outlook" target="_blank" rel="noopener noreferrer">Outlook</a>
			<button id="download" type="button">Apple Calendar / скачать .ics</button>
		</nav>
		<p>Добавление происходит только по вашему выбору. После переноса или отмены встречи обновите запись в своем календаре вручную.</p>
	</main>
	<script src="calendar.js"></script>
</body>
</html>
